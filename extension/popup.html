<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>ReplyTrack</title>
		<style>
			:root {
				--fg: #1d2226;
				--muted: #5e6670;
				--line: #e3e6e8;
				--accent: #0a66c2;
				--bad: #b42318;
				--ok: #067647;
			}
			* {
				box-sizing: border-box;
			}
			body {
				width: 300px;
				margin: 0;
				padding: 14px 16px 16px;
				font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				color: var(--fg);
				background: #fff;
			}
			h1 {
				font-size: 15px;
				margin: 0 0 10px;
			}
			dl {
				display: grid;
				grid-template-columns: auto 1fr;
				gap: 4px 10px;
				margin: 0 0 12px;
			}
			dt {
				color: var(--muted);
			}
			dd {
				margin: 0;
				font-weight: 600;
				word-break: break-word;
			}
			.status {
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 6px;
				margin-bottom: 12px;
				white-space: pre-wrap;
			}
			.status.bad {
				border-color: #f4c7c3;
				background: #fef3f2;
				color: var(--bad);
			}
			.status.running {
				border-color: #b3d4f5;
				background: #f0f7ff;
			}
			button {
				width: 100%;
				padding: 9px;
				font: inherit;
				font-weight: 600;
				color: #fff;
				background: var(--accent);
				border: 0;
				border-radius: 6px;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.55;
				cursor: default;
			}
			#toggle {
				margin-top: 8px;
			}
			#toggle.stop {
				background: var(--bad);
			}
			#toggle.start {
				background: var(--ok);
			}
			#state.running {
				color: var(--ok);
			}
			#state.syncing {
				color: var(--accent);
			}
			#state.stopped {
				color: var(--bad);
			}
			.foot {
				margin-top: 10px;
				text-align: center;
			}
			a {
				color: var(--accent);
			}
			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<h1>ReplyTrack</h1>

		<div id="setup" class="status bad hidden">Not set up yet. <a href="#" id="setupLink">Open settings</a> and enter your tab name and Apps Script URL.</div>

		<dl>
			<dt>Status</dt>
			<dd id="state">—</dd>
			<dt>Tab</dt>
			<dd id="tab">—</dd>
			<dt>Last sync</dt>
			<dd id="lastSync">never</dd>
			<dt>Replies sent</dt>
			<dd id="lastSent">—</dd>
		</dl>

		<div id="status" class="status">Loading…</div>

		<button id="syncNow">Sync now</button>
		<button id="toggle" class="stop">Stop sync</button>
		<div class="foot"><a href="#" id="settings">Settings</a></div>

		<script src="popup.js"></script>
	</body>
</html>
